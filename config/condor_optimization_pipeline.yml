max_concurrent_tasks: 4
retry_failed_tasks: true
storage:
  type: sqlite

tasks:
  candles_sync:
    enabled: true
    task_class: app.tasks.data_collection.candles_downloader_task.CandlesDownloaderTask
    schedule:
      type: frequency
      frequency_hours: 6.0
    config:
      connector_name: binance_perpetual
      quote_asset: USDT
      pairs_from_optimization_configs:
        - config/optimize_macd_bb.yml
      intervals:
        - 15m
        - 1h
      days_data_retention: 60

  strategy_optimizer:
    enabled: true
    task_class: app.tasks.optimization.universal_optimization_task.UniversalOptimizationTask
    dependencies:
      - task_name: candles_sync
        on_completion: true
        delay_seconds: 60
    schedule:
      type: frequency
      frequency_hours: 6.0
    config:
      optimization_configs:
        - config/optimize_macd_bb.yml
      auto_export_to_condor: true
      auto_deploy: false
      notify_telegram: true
      continue_on_error: false

  condor_health_check:
    enabled: true
    task_class: app.tasks.deployment.condor_health_task.CondorHealthTask
    schedule:
      type: frequency
      frequency_hours: 1.0
    config:
      hummingbot_api_url: "${HUMMINGBOT_API_URL}"
      hummingbot_port: 8000
      alert_on_bot_stopped: true
      notification:
        alert_only: true
        telegram_chat_ids: []

  telegram_approval_listener:
    enabled: true
    task_class: app.tasks.deployment.telegram_approval_task.TelegramApprovalTask
    schedule:
      type: frequency
      frequency_hours: 0.05
    config:
      hummingbot_api_url: "${HUMMINGBOT_API_URL}"
      hummingbot_port: 8000
      authorized_chat_ids: []
