study:
  name: "macd_bb_btc_q2_2026"
  controller: "macd_bb_v1"
  n_trials: 25
  direction: maximize
  objective: sharpe_ratio

data:
  connector: "binance_perpetual"
  trading_pairs:
    - "BTC-USDT"
    - "ETH-USDT"
  interval: "15m"
  lookback_days: 60
  end_time_buffer_hours: 6

param_ranges:
  bb_length:
    type: int
    low: 20
    high: 200
    step: 10
  bb_std:
    type: float
    low: 1.5
    high: 3.0
    step: 0.25
  macd_fast:
    type: int
    low: 9
    high: 30
    step: 3
  macd_slow:
    type: int
    low: 21
    high: 60
    step: 3
  macd_signal:
    type: int
    low: 5
    high: 15
    step: 1
  max_executors_per_side:
    type: int
    low: 1
    high: 3
    step: 1
  fixed:
    total_amount_quote: 1000
    take_profit: 0.05
    stop_loss: 0.03
    cooldown_time: 900

risk_limits:
  max_drawdown_filter: 0.15
  min_trades_filter: 30

validation:
  enabled: true
  ratio: 0.2

export:
  top_k: 2
  auto_deploy: false
  condor_agents_dir: "~/condor/agents"
  notify_telegram: false
  tick_interval_seconds: 60
